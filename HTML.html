<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PW IOI Scholarship Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="calculator-container">
        <div class="header">
            <i class="fas fa-graduation-cap header-icon"></i>
            <h1 class="title">PW IOI Scholarship Calculator</h1>
            <p class="description">Calculate your eligibility and potential scholarship amount based on the official policy.</p>
        </div>
        
        <div class="input-section">
            <div class="input-group">
                <label for="academic-score">
                    <i class="fas fa-percent icon"></i> Semester Percentage (%)
                </label>
                <input type="number" id="academic-score" placeholder="e.g., 91" min="0" max="100" class="input-field">
            </div>
            <div class="input-group">
                <label for="total-days">
                    <i class="fas fa-calendar-alt icon"></i> Total Working Days
                </label>
                <input type="number" id="total-days" placeholder="e.g., 100" min="0" class="input-field">
            </div>
            <div class="input-group">
                <label for="present-days">
                    <i class="fas fa-calendar-check icon"></i> Days Present
                </label>
                <input type="number" id="present-days" placeholder="e.g., 95" min="0" class="input-field">
            </div>

            <div class="input-group toggle-group">
                <label for="has-recommendation" class="toggle-label">
                    <i class="fas fa-file-alt icon"></i> Have a Recommendation Letter?
                </label>
                <input type="checkbox" id="has-recommendation" class="toggle-switch">
                <label for="has-recommendation" class="toggle-slider"></label>
            </div>
            <div class="input-group toggle-group">
                <label for="participated-events" class="toggle-label">
                    <i class="fas fa-trophy icon"></i> Participated in Events Outside IOI?
                </label>
                <input type="checkbox" id="participated-events" class="toggle-switch">
                <label for="participated-events" class="toggle-slider"></label>
            </div>
            <button id="calculate-btn" class="btn-primary">
                <i class="fas fa-calculator icon-left"></i> Calculate Scholarship
            </button>
        </div>

        <div class="results-section" id="results-section">
            </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
